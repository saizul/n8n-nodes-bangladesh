name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@saizul'
      - run: npm ci --ignore-scripts
      - run: npm run build
      # GitHub Packages requires a scoped name that matches the repository owner.
      - name: Scope the package for GitHub Packages
        run: |
          npm pkg set name="@saizul/n8n-nodes-bangladesh"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm pkg set repository.url="git+https://github.com/saizul/n8n-nodes-bangladesh.git"
      # build, lint and tests already ran above and in CI; skip prepublishOnly, whose tests assert the unscoped npm name
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
